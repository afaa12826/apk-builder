nama: Web ke APK

pada:
  pengiriman_alur_kerja:
    masukan:
      URL web:
        deskripsi: 'URL Situs Web'
        diperlukan: benar
      nama_aplikasi:
        deskripsi: 'Nama Aplikasi'
        diperlukan: benar
      ikon_url:
        deskripsi: 'Ikon URL'
        diperlukan: benar

Pekerjaan:
  membangun:
    berjalan di: ubuntu-latest
    tangga:
      - nama: Checkout
        penggunaan: actions/checkout@v3

      - nama: Pengaturan Java
        penggunaan: actions/setup-java@v3
        dengan:
          distribusi: 'zulu'
          versi java: '17'

      - nama: Pengaturan Flutter
        menggunakan: subosito/flutter-action@v2
        dengan:
          saluran: 'stabil'

      - nama: Membangun Web2APK
        jalankan: |
          flutter create --org com.web2apk --project-name web2apk .
          cd web2apk
          sed -i "s|https://example.com|${{ github.event.inputs.web_url }}|g" lib/main.dart
          flutter pub get
          flutter build apk --release

      - nama: Unggah Artefak
        penggunaan: actions/upload-artifact@v3
        dengan:
          nama: web2apk-apk
          jalur: web2apk/build/app/outputs/flutter-apk/*.apk
