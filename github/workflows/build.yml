name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: 'URL Release ZIP'
        required: true
      tag:
        description: 'Tag build'
        required: true
      build_type:
        description: 'release atau debug'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download ZIP from Release
        run: |
          curl -L -o project.zip "${{ github.event.inputs.release_url }}/assets/${{ github.event.inputs.tag }}.zip"
          unzip project.zip -d flutter_project
          
      - name: Build APK
        run: |
          cd flutter_project
          flutter pub get
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: flutter-apk
          path: flutter_project/build/app/outputs/flutter-apk/*.apk
